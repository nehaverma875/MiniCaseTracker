<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Mini Case Tracker</title>
    <style>
      :root {
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
      }

      .initial-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
      }

      .initial-loader__content {
        font-size: 18px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" aria-label="Loading Mini Case Tracker">
        <div class="initial-loader__content">Mini Case Tracker</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
